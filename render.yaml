# Blueprint de Render: crea la base PostgreSQL y el servicio web con un solo clic
# Render → New → Blueprint → seleccionar este repositorio.
databases:
  - name: vastago-db
    plan: free
    databaseName: vastago
    user: vastago_app
    postgresMajorVersion: "16"

services:
  - type: web
    name: vastago-sistema
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: vastago-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true                 # secreto aleatorio, nunca está en el repositorio
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true                 # clave AES-256 (256 bits en base64)
      - key: DEMO_PASSWORD
        sync: false                         # la defines tú en el panel de Render (no se guarda en Git)
