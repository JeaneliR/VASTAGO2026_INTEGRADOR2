<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vástago & Co</title>
    <!-- Enlace a la hoja de estilos base -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Panel izquierdo: Branding -->
        <aside class="login-branding">
            <div class="branding-content">
                <h1>Chocolate inteligente para un futuro <span>más grande.</span></h1>
                <p>Gestión inteligente de producción e inventarios.</p>
            </div>
        </aside>

        <!-- Panel derecho: Formulario de autenticación -->
        <main class="login-form-section">
            <div class="login-card">
                <div class="logo-container">
                    <h2>Vástago & Co</h2>
                    <span class="subtitle">CHOCOLATE CON PROPÓSITO</span>
                </div>
                
                <h3>Sistema de Gestión de Producción e Inventarios</h3>
                
                <!-- Formulario semántico -->
                <form id="loginForm" action="app.html">
                    <div class="input-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="javier@vastago.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••••••" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Recordar sesión
                        </label>
                        <a href="#" class="forgot-password">¿Recuperar contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary">Iniciar sesión</button>
                </form>
                
                <footer class="login-footer">
                    <p>Vástago & Co · 2026</p>
                </footer>
            </div>
        </main>
    </div>



    
    <!-- Importamos los datos simulados -->
    <script src="js/data.js"></script>
    <script>
        // Lógica rápida de validación para el prototipo de Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita el envío por defecto

            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('password').value.trim();

            // Buscamos si el usuario existe en mockData
            const usuarioEncontrado = mockData.usuarios.find(u => u.email === emailInput && u.password === passInput);

            if (usuarioEncontrado) {
                // Guardamos los datos del usuario activo en el almacenamiento local del navegador
                localStorage.setItem('usuarioActivo', JSON.stringify(usuarioEncontrado));
                // Redirigimos a la aplicación principal
                window.location.href = 'app.html';
            } else {
                alert('Credenciales incorrectas. Pruebe con: javier@vastago.com / 123');
            }
        });
    </script>













</body>
</html>
