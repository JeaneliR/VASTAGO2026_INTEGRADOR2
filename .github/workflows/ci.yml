name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vastago_app, POSTGRES_PASSWORD: app-secret, POSTGRES_DB: vastago_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U vastago_app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements.txt pytest bandit pip-audit
      - run: cd backend && python -m pytest tests -q
        env:
          DATABASE_URL: postgresql://vastago_app:app-secret@127.0.0.1:5433/vastago_test
          EMAIL_SCHEDULER_ENABLED: 'false'
      - run: cd backend && bandit -r app -q && pip-audit -r requirements.txt
